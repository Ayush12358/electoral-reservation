name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate tracked input checksums
        run: python scripts/validate_checksums.py
      - name: Run lightweight core analysis
        run: python experiments/analysis_with_controls.py
      - name: Audit manuscript consistency
        run: python experiments/manuscript_consistency_audit.py
      - name: Rebuild and verify release manifest
        run: |
          python scripts/build_release.py
          python experiments/verify_release.py
